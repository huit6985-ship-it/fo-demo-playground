<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行 · Fo Demo × Muse</title>
<style>
  :root { --speed: 1; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 14px 16px 12px;
    background: radial-gradient(120% 90% at 50% 0%, #1b2436 0%, #0d1119 58%, #090c12 100%);
    color: #e8ecf8;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { text-align: center; flex-shrink: 0; }
  .kicker {
    margin: 0 0 2px; font-size: .68rem; letter-spacing: .34em; text-indent: .34em;
    color: rgba(232,236,248,.48); font-weight: 600;
  }
  h1 {
    margin: 0; font-size: clamp(1.05rem, 2.6vh, 1.5rem); font-weight: 700;
    letter-spacing: .14em; text-indent: .14em; color: #f5d78e;
  }
  .stage {
    position: relative;
    flex: 1 1 auto; min-height: 0;
    width: min(100%, 1000px);
    display: flex; border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.35);
  }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 90px rgba(10,18,32,.28);
  }
  svg { display: block; width: 100%; height: 100%; background: #8ecfe8; }
  .controls {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.055); padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(8px); max-width: 100%;
  }
  label { font-size: .92rem; color: rgba(232,236,248,.75); letter-spacing: .08em; }
  #speed-val { font-size: .9rem; color: #f5d78e; font-variant-numeric: tabular-nums; min-width: 2.6em; }
  input[type=range] { width: min(220px, 36vw); height: 34px; accent-color: #f0b429; touch-action: none; cursor: pointer; }
  button {
    font: inherit; font-size: .92rem; padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(245,215,142,.55); background: rgba(245,215,142,.07);
    color: #f5d78e; cursor: pointer; transition: background .2s ease, transform .15s ease;
  }
  button:hover { background: rgba(245,215,142,.18); }
  button:active { transform: scale(.97); }
  .hint { margin: 0; font-size: .88rem; color: rgba(232,236,248,.5); flex-shrink: 0; text-align: center; letter-spacing: .05em; }
  @media (max-height: 600px) {
    .hint, .kicker { display: none; }
    .controls { padding: 6px 14px; }
  }
  @media (max-width: 560px) {
    .controls { border-radius: 22px; }
  }

  /* ---------- 动画 ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spokes {
    transform-box: view-box;
    animation: spin calc(1.1s / var(--speed)) linear infinite;
  }
  .spokes.rear  { transform-origin: 250px 375px; }
  .spokes.front { transform-origin: 560px 375px; }
  .crank { transform-box: view-box; transform-origin: 352px 375px; animation: spin calc(1.1s / var(--speed)) linear infinite; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .pelican { animation: bob calc(.55s / var(--speed)) ease-in-out infinite; transform-box: view-box; }

  @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(-1050px); } }
  .clouds { animation: cloud calc(46s / var(--speed)) linear infinite; }

  @keyframes road { to { stroke-dashoffset: -70; } }
  .dash { animation: road calc(.6s / var(--speed)) linear infinite; }

  /* 视差：中景树线慢移、前景草叶快移，骑行才有速度感 */
  @keyframes drift900 { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  .bg-drift { animation: drift900 calc(52s / var(--speed)) linear infinite; }
  .fg-drift { animation: drift900 calc(6.5s / var(--speed)) linear infinite; }

  @keyframes bird-drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(46px,-10px); } }
  .birds { animation: bird-drift 9s ease-in-out infinite; }

  /* 红围巾随风飘（速度越快飘得越急） */
  @keyframes flutter { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-9deg); } }
  .scarf-tail {
    transform-box: fill-box; transform-origin: 100% 50%;
    animation: flutter calc(.48s / var(--speed)) ease-in-out infinite;
  }
  /* 车筐里的小鱼尾巴 */
  @keyframes wiggle { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
  .fish-tail {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: wiggle calc(.7s / var(--speed)) ease-in-out infinite;
  }

  @keyframes flap { 0%,100% { transform: rotate(0deg); } 40% { transform: rotate(-38deg); } }
  .wing { transform-box: fill-box; transform-origin: 15% 20%; }
  .flapping .wing { animation: flap .45s ease-in-out 2; }

  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.15); } 30%,80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.8) translateY(-8px); } }
  .quack { opacity: 0; transform-box: fill-box; transform-origin: 80% 100%; pointer-events: none; }
  .flapping .quack { animation: pop .9s ease-out 1; }

  /* 高速时才出现的风线 */
  .wind { opacity: 0; transition: opacity .4s ease; }
  .fast .wind { opacity: .55; }
  @keyframes wind-dash { to { stroke-dashoffset: -56; } }
  .wind line { stroke-dasharray: 34 22; animation: wind-dash calc(.4s / var(--speed)) linear infinite; }

  /* ---------- 昼夜切换 ---------- */
  .night-sky, .night-sun { opacity: 0; transition: opacity .8s ease; }
  .night .night-sky, .night .night-sun { opacity: 1; }
  .night .clouds { opacity: .26; }
  .night .sun { opacity: 0; }
  .sun { transition: opacity .8s ease; }
  .stars { opacity: 0; transition: opacity .8s ease; }
  .night .stars { opacity: 1; }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .night .stars circle { animation: twinkle 2.6s ease-in-out infinite; }
  .night .stars circle:nth-child(3n) { animation-delay: .7s; }
  .night .stars circle:nth-child(4n) { animation-delay: 1.3s; }
  .hill-far, .hill-mid, .road, .dash { transition: fill .8s ease, stroke .8s ease; }
  .night .hill-far { fill: #33506b; }
  .night .hill-mid { fill: #274435; }
  .night .road { fill: #222836; }
  .night-shade, .night-veil { opacity: 0; transition: opacity .8s ease; }
  .night .night-shade { opacity: .5; }
  .night .night-veil { opacity: .16; }
  .fireflies { opacity: 0; transition: opacity 1s ease; }
  .night .fireflies { opacity: 1; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .fireflies circle { animation: floaty 3.4s ease-in-out infinite; }
  .fireflies circle:nth-child(2n) { animation-delay: 1.1s; }
  .fireflies circle:nth-child(3n) { animation-delay: 2s; }
  .pelican, .bike { cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    svg * { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<header>
  <p class="kicker">A TINY SEASIDE LOOP</p>
  <h1>鹈鹕骑行</h1>
</header>

<div class="stage">
<svg id="scene" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="鹈鹕骑自行车的动画场景">
  <defs>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb9de"/><stop offset=".55" stop-color="#a8d8ec"/><stop offset="1" stop-color="#fdeec9"/>

    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">

    </linearGradient>
    <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">

    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b733"/><stop offset="1" stop-color="#ee9420"/>
    </linearGradient>
    <radialGradient id="sunHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".5"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空（上下加长，竖屏放大后也不会露底） -->
  <rect x="0" y="-600" width="900" height="1120" fill="url(#skyDay)"/>
  <g class="night-sky"><rect x="0" y="-600" width="900" height="1120" fill="url(#skyNight)"/></g>

  <!-- 太阳 / 月亮 -->
  <g class="sun">
    <circle cx="745" cy="95" r="78" fill="url(#sunHalo)"/>
    <circle cx="745" cy="95" r="44" fill="#ffd166"/>
  </g>
  <g class="night-sun">
    <circle cx="745" cy="95" r="62" fill="#f6efdb" opacity=".14"/>
    <circle cx="745" cy="95" r="37" fill="#f6efdb"/>
    <circle cx="733" cy="86" r="6" fill="#ddd3b8"/><circle cx="756" cy="104" r="4.5" fill="#ddd3b8"/><circle cx="750" cy="80" r="3" fill="#ddd3b8"/>
  </g>
  <g class="stars" fill="#ffffff">
    <circle cx="80" cy="70" r="2"/><circle cx="180" cy="120" r="1.6"/><circle cx="320" cy="60" r="2"/>
    <circle cx="470" cy="110" r="1.5"/><circle cx="620" cy="55" r="2"/><circle cx="700" cy="150" r="1.6"/>
    <circle cx="140" cy="180" r="1.4"/><circle cx="560" cy="170" r="1.4"/>
    <circle cx="300" cy="-40" r="1.6"/><circle cx="450" cy="-90" r="1.5"/><circle cx="650" cy="-30" r="1.6"/>
  </g>

  <!-- 远处的小鸟 -->
  <g class="birds" stroke="#33506b" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55">
    <path d="M118 84 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M196 58 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <!-- 云：主层暖白 + 一层薄云点缀 -->
  <g class="clouds" fill="#ffffff" opacity=".92">
    <g>
      <ellipse cx="150" cy="110" rx="55" ry="21"/><ellipse cx="200" cy="95" rx="40" ry="17"/>
      <ellipse cx="105" cy="100" rx="35" ry="15"/>
      <ellipse cx="540" cy="80" rx="65" ry="23"/><ellipse cx="600" cy="65" rx="45" ry="17"/>
      <ellipse cx="900" cy="130" rx="50" ry="19"/><ellipse cx="950" cy="118" rx="38" ry="15"/>
    </g>
    <g transform="translate(1050,0)">
      <ellipse cx="150" cy="110" rx="55" ry="21"/><ellipse cx="200" cy="95" rx="40" ry="17"/>
      <ellipse cx="105" cy="100" rx="35" ry="15"/>
      <ellipse cx="540" cy="80" rx="65" ry="23"/><ellipse cx="600" cy="65" rx="45" ry="17"/>
      <ellipse cx="900" cy="130" rx="50" ry="19"/><ellipse cx="950" cy="118" rx="38" ry="15"/>
    </g>
  </g>
  <!-- 远山：两层雾色拉开纵深 -->
  <path class="hill-far" d="M0 430 L150 322 L310 430 Z" fill="#a8c3a0" opacity=".55"/>
  <path class="hill-far" d="M540 430 L745 330 L900 430 Z" fill="#a8c3a0" opacity=".55"/>
  <path class="hill-mid" d="M200 430 L425 302 L650 430 Z" fill="#7aa874" opacity=".75"/>

  <!-- 草地 -->
  <rect y="425" width="900" height="600" fill="url(#meadowGrad)"/>

  <!-- 中景树线（慢速视差，两份无缝衔接） -->
  <g class="bg-drift" fill="#3f6b34" opacity=".5">
    <g>
      <circle cx="90" cy="404" r="17"/><rect x="87" y="404" width="6" height="24" fill="#5d4630"/>
      <circle cx="330" cy="398" r="21"/><rect x="327" y="398" width="6" height="30" fill="#5d4630"/>
      <circle cx="612" cy="406" r="15"/><rect x="609" y="406" width="6" height="22" fill="#5d4630"/>
      <circle cx="828" cy="400" r="19"/><rect x="825" y="400" width="6" height="28" fill="#5d4630"/>
    </g>
    <g transform="translate(900,0)">
      <circle cx="90" cy="404" r="17"/><rect x="87" y="404" width="6" height="24" fill="#5d4630"/>
      <circle cx="330" cy="398" r="21"/><rect x="327" y="398" width="6" height="30" fill="#5d4630"/>
      <circle cx="612" cy="406" r="15"/><rect x="609" y="406" width="6" height="22" fill="#5d4630"/>
      <circle cx="828" cy="400" r="19"/><rect x="825" y="400" width="6" height="28" fill="#5d4630"/>
    </g>
  </g>

  <!-- 路边点缀：克制版——一棵近树、几丛灌木、零星小花 -->
  <g>
    <rect x="196" y="386" width="11" height="44" fill="#7a5230"/>
    <circle cx="202" cy="368" r="27" fill="#3f6b34"/><circle cx="186" cy="381" r="18" fill="#4a7a3e"/><circle cx="218" cy="380" r="16" fill="#4a7a3e"/>
    <ellipse cx="688" cy="440" rx="27" ry="13" fill="#3f6b34"/>
    <ellipse cx="118" cy="442" rx="21" ry="10" fill="#3f6b34"/>
    <ellipse cx="452" cy="444" rx="17" ry="8" fill="#4a7a3e"/>
    <circle cx="300" cy="552" r="4" fill="#ffd166"/><circle cx="520" cy="560" r="4" fill="#f9a8c9"/>
    <circle cx="244" cy="572" r="4" fill="#ffffff"/><circle cx="640" cy="566" r="4" fill="#ffd166"/>
    <circle cx="392" cy="580" r="4" fill="#f9a8c9"/>
    <circle cx="344" cy="600" r="7" fill="#8a8f98" opacity=".8"/><circle cx="560" cy="606" r="6" fill="#8a8f98" opacity=".8"/>
  </g>

  <!-- 夜幕罩住草地（只罩下半，避免夜里草地还亮着） -->
  <rect class="night-shade" y="425" width="900" height="600" fill="#16283f"/>

  <!-- 公路 -->
  <rect class="road" y="452" width="900" height="48" fill="#343a44"/>
  <rect y="452" width="900" height="3" fill="#f5d78e" opacity=".35"/>
  <line class="dash" x1="-70" y1="478" x2="970" y2="478" stroke="#f4f1de" stroke-width="4" stroke-dasharray="40 30" opacity=".9"/>

  <!-- 前景草叶（快速视差，贴在画面下沿） -->
  <g class="fg-drift" stroke="#2e5427" stroke-width="4" stroke-linecap="round" fill="none">
    <g>
      <path d="M60 522 q3 -16 10 -22"/><path d="M74 522 q-2 -13 -8 -19"/>
      <path d="M300 522 q3 -15 9 -21"/><path d="M470 522 q-3 -14 -9 -20"/>
      <path d="M660 522 q3 -16 10 -22"/><path d="M830 522 q-2 -13 -8 -19"/>
    </g>
    <g transform="translate(900,0)">
      <path d="M60 522 q3 -16 10 -22"/><path d="M74 522 q-2 -13 -8 -19"/>
      <path d="M300 522 q3 -15 9 -21"/><path d="M470 522 q-3 -14 -9 -20"/>
      <path d="M660 522 q3 -16 10 -22"/><path d="M830 522 q-2 -13 -8 -19"/>
    </g>
  </g>

  <!-- 萤火虫（只在夜里） -->
  <g class="fireflies" fill="#ffe98a">
    <circle cx="180" cy="470" r="3"/><circle cx="330" cy="492" r="2.4"/><circle cx="520" cy="466" r="2.8"/>
    <circle cx="690" cy="488" r="2.4"/><circle cx="770" cy="462" r="3"/><circle cx="90" cy="496" r="2.2"/>
  </g>

  <!-- 地面投影 -->
  <ellipse cx="405" cy="437" rx="205" ry="9" fill="#1d2b1a" opacity=".22"/>

  <!-- 风线（高速时出现） -->
  <g class="wind" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="96" y1="212" x2="196" y2="212"/>
    <line x1="70" y1="258" x2="186" y2="258"/>
    <line x1="104" y1="304" x2="190" y2="304"/>
  </g>

  <!-- 自行车 -->
  <g class="bike" stroke-linecap="round">
    <!-- 后轮 -->
    <g>
      <circle cx="250" cy="375" r="56" fill="none" stroke="#22303e" stroke-width="9"/>
      <circle cx="250" cy="375" r="49" fill="none" stroke="#e9e2cd" stroke-width="2" opacity=".5"/>
      <circle cx="250" cy="375" r="6" fill="#22303e"/>
      <g class="spokes rear" stroke="#7d8ea3" stroke-width="3">
        <line x1="250" y1="321" x2="250" y2="429"/>
        <line x1="196" y1="375" x2="304" y2="375"/>
        <line x1="212" y1="337" x2="288" y2="413"/>
        <line x1="288" y1="337" x2="212" y2="413"/>
      </g>
    </g>
    <!-- 前轮 -->
    <g>
      <circle cx="560" cy="375" r="56" fill="none" stroke="#22303e" stroke-width="9"/>
      <circle cx="560" cy="375" r="49" fill="none" stroke="#e9e2cd" stroke-width="2" opacity=".5"/>
      <circle cx="560" cy="375" r="6" fill="#22303e"/>
      <g class="spokes front" stroke="#7d8ea3" stroke-width="3">
        <line x1="560" y1="321" x2="560" y2="429"/>
        <line x1="506" y1="375" x2="614" y2="375"/>
        <line x1="522" y1="337" x2="598" y2="413"/>
        <line x1="598" y1="337" x2="522" y2="413"/>
      </g>
    </g>
    <!-- 车架：深青 + 一道奶油色描边提气 -->
    <g stroke="#1f7a8c" stroke-width="9" fill="none">
      <path d="M250 375 L352 375 L312 268 L250 375"/>
      <path d="M352 375 L528 262 L560 375"/>
      <path d="M312 268 L528 262"/>
      <path d="M528 262 L560 375"/>
    </g>
    <path d="M318 272 L522 266" stroke="#9fd4dd" stroke-width="2.5" fill="none" opacity=".8"/>
    <!-- 挡泥板 -->
    <path d="M196 348 A 58 58 0 0 1 250 317" fill="none" stroke="#1f7a8c" stroke-width="6"/>
    <path d="M508 344 A 58 58 0 0 1 566 317" fill="none" stroke="#1f7a8c" stroke-width="6"/>
    <!-- 座管与车把 -->

    <path d="M528 262 Q 536 238 556 240" fill="none" stroke="#22303e" stroke-width="8"/>

    <ellipse cx="298" cy="243" rx="24" ry="6" fill="#a97a48"/>

      <line x1="352" y1="375" x2="384" y2="352" stroke="#22303e" stroke-width="6"/>

      <rect x="376" y="346" width="18" height="8" rx="3" fill="#111827"/>
      <rect x="306" y="394" width="18" height="8" rx="3" fill="#111827"/>

    <circle cx="352" cy="375" r="10" fill="#22303e"/>
    <!-- 链条 -->

    <g>
      <path d="M532 272 L586 272 L577 308 L541 308 Z" fill="#b07a45"/>
      <path d="M536 283 L582 283 M539 295 L579 295" stroke="#8a5a2e" stroke-width="3"/>
      <path d="M532 272 L586 272" stroke="#8a5a2e" stroke-width="5"/>
      <path d="M534 276 L524 258" stroke="#22303e" stroke-width="4"/>

  <!-- 鹈鹕 -->
  <g class="pelican" id="pelican">
    <!-- 后腿（简化为连到曲柄） -->
    <path d="M310 285 Q 330 330 320 396" fill="none" stroke="#e8892b" stroke-width="7" stroke-linecap="round"/>
    <!-- 尾羽 -->

    <!-- 身体 -->
    <ellipse cx="300" cy="252" rx="52" ry="36" fill="#fdfdf8"/>
    <ellipse cx="302" cy="268" rx="40" ry="17" fill="#eee7d2" opacity=".75"/>
    <!-- 脖子与头 -->
    <path d="M330 235 Q 352 205 356 178" fill="none" stroke="#fdfdf8" stroke-width="16" stroke-linecap="round"/>

    <!-- 头顶呆毛 -->
    <path d="M352 158 Q 350 146 342 142 M358 157 Q 360 146 368 141" stroke="#f1ead6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- 大嘴与喉囊 -->
    <path d="M368 170 L454 186 L368 182 Z" fill="url(#beakGrad)"/>
    <path d="M370 182 Q 402 216 454 186 L370 182 Z" fill="#f7b955"/>
    <path d="M372 181 L450 186" stroke="#d97f16" stroke-width="1.6" opacity=".6"/>
    <!-- 眼睛 + 腮红 -->
    <circle cx="356" cy="166" r="3.2" fill="#1f2937"/>
    <circle cx="357" cy="165" r="1" fill="#fff"/>
    <ellipse cx="349" cy="179" rx="5.5" ry="3.4" fill="#f5a3a3" opacity=".55"/>
    <!-- 围巾尾（搭在背上向后飘，速度越快飘得越急） -->
    <g class="scarf-tail">
      <path d="M336 226 Q 292 202 250 214 Q 262 226 282 228 Q 262 232 252 244 Q 296 246 334 240 Z" fill="#d64541"/>
      <path d="M300 218 Q 282 226 268 224" stroke="#b03030" stroke-width="2.5" fill="none" opacity=".6"/>
    </g>
    <!-- 围巾结 -->
    <ellipse cx="339" cy="230" rx="13" ry="9" fill="#d64541" transform="rotate(-28 339 230)"/>
    <ellipse cx="335" cy="227" rx="7" ry="4.5" fill="#e2574f" opacity=".55" transform="rotate(-28 335 227)"/>
    <!-- 翅膀：两层羽毛 -->
    <g class="wing">
      <path d="M256 238 Q 300 218 332 242 Q 328 274 290 280 Q 258 272 256 238 Z" fill="#efe8d3"/>
      <path d="M268 250 Q 298 236 322 250 Q 316 268 292 271 Q 272 266 268 250 Z" fill="#e0d4b4"/>
      <path d="M276 244 Q 292 258 292 270 M294 240 Q 308 252 310 264" stroke="#cbbd97" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 前腿 -->
    <path d="M322 280 Q 350 340 380 354" fill="none" stroke="#f5a623" stroke-width="7" stroke-linecap="round"/>
    <!-- 嘎气泡 -->
    <g class="quack">
      <rect x="410" y="112" width="86" height="44" rx="14" fill="#ffffff" stroke="#d64541" stroke-width="3"/>
      <path d="M428 152 L420 170 L446 156 Z" fill="#ffffff" stroke="#d64541" stroke-width="3"/>
      <text x="453" y="141" font-size="24" text-anchor="middle" fill="#d64541" font-family="system-ui">嘎!</text>
    </g>
  </g>

  <!-- 夜幕轻罩全场（最后统一压暗） -->
  <rect class="night-veil" x="0" y="-600" width="900" height="1120" fill="#0d1b3d"/>
</svg>
</div>

<div class="controls">
  <label for="speed">速度</label>
  <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1">
  <span id="speed-val">×1.0</span>
  <button id="toggle-night" aria-pressed="false">切换到夜晚</button>
  <button id="honk">让鹈鹕叫一声</button>
</div>
<p class="hint">点击鹈鹕也有惊喜 · 滑块拉满有风</p>

<script>
  const scene = document.getElementById('scene');
  const pelican = document.getElementById('pelican');
  const speed = document.getElementById('speed');
  const speedVal = document.getElementById('speed-val');
  const stage = document.querySelector('.stage');
  speed.addEventListener('input', () => {
    const v = parseFloat(speed.value) || 1;
    scene.style.setProperty('--speed', v);
    speedVal.textContent = '×' + v.toFixed(1);
    scene.classList.toggle('fast', v >= 2);
  });

  function honk() {
    pelican.classList.remove('flapping');
    void pelican.getBoundingClientRect();  // 重置动画
    pelican.classList.add('flapping');
  }
  pelican.addEventListener('click', honk);
  document.getElementById('honk').addEventListener('click', honk);

  const nightBtn = document.getElementById('toggle-night');
  nightBtn.addEventListener('click', () => {
    const night = scene.classList.toggle('night');
    nightBtn.textContent = night ? '切换到白天' : '切换到夜晚';
    nightBtn.setAttribute('aria-pressed', String(night));
  });

  // 视口适配：宽屏用完整 900x520 画面；竖屏收窄视野、放大角色，构图居中
  function fitView() {
    const r = stage.getBoundingClientRect();
    const ar = r.width / Math.max(1, r.height);
    if (ar >= 900 / 520) {
      scene.setAttribute('viewBox', '0 0 900 520');
    } else {
      const w = 520, h = w / ar, x0 = 150, y0 = 280 - h / 2;
      scene.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`);
    }
  }
  window.addEventListener('resize', fitView);
  fitView();
</script>
</body>
</html>
