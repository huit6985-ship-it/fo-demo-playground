<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行 · Fo Demo</title>
<style>
  :root { --speed: 1; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 12px 16px;
    background: #0b1020; color: #e8ecf8;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { margin: 0; font-size: clamp(1rem, 2.4vh, 1.4rem); font-weight: 600; letter-spacing: .05em; color: #ffd166; flex-shrink: 0; }
  .stage {
    flex: 1 1 auto; min-height: 0;
    width: min(100%, 1000px);
    display: flex; border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  svg { display: block; width: 100%; height: 100%; background: #87c7f5; }
  .controls {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.06); padding: 10px 18px; border-radius: 14px;
    max-width: 100%;
  }
  label { font-size: .95rem; color: #cfd8f0; }
  input[type=range] { width: min(220px, 38vw); height: 34px; accent-color: #ffd166; touch-action: none; }
  button {
    font: inherit; font-size: .95rem; padding: 10px 20px; border-radius: 999px; border: 1.5px solid #ffd166;
    background: transparent; color: #ffd166; cursor: pointer;
  }
  button:hover { background: rgba(255,209,102,.15); }
  .hint { margin: 0; font-size: .95rem; color: #d7def5; flex-shrink: 0; text-align: center; }
  @media (max-height: 600px) {
    .hint { display: none; }
    .controls { padding: 6px 14px; }
  }

  /* ---------- 动画 ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spokes {
    transform-box: view-box;
    animation: spin calc(1.1s / var(--speed)) linear infinite;
  }
  .spokes.rear  { transform-origin: 250px 375px; }
  .spokes.front { transform-origin: 560px 375px; }
  .crank { transform-box: view-box; transform-origin: 352px 375px; animation: spin calc(1.1s / var(--speed)) linear infinite; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .pelican { animation: bob calc(.55s / var(--speed)) ease-in-out infinite; }
  .pelican { transform-box: view-box; }

  @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(-1050px); } }
  .clouds { animation: cloud calc(38s / var(--speed)) linear infinite; }

  @keyframes road { to { stroke-dashoffset: -70; } }
  .dash { animation: road calc(.6s / var(--speed)) linear infinite; }

  @keyframes flap { 0%,100% { transform: rotate(0deg); } 40% { transform: rotate(-38deg); } }
  .wing { transform-box: fill-box; transform-origin: 15% 20%; }
  .flapping .wing { animation: flap .45s ease-in-out 2; }

  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.15); } 30%,80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.8) translateY(-8px); } }
  .quack { opacity: 0; transform-box: fill-box; transform-origin: 80% 100%; pointer-events: none; }
  .flapping .quack { animation: pop .9s ease-out 1; }

  /* 昼夜切换 */
  .night-sky, .night-sun { opacity: 0; transition: opacity .8s ease; }
  .night .night-sky, .night .night-sun { opacity: 1; }
  .night .sun { opacity: 0; }
  .sun { transition: opacity .8s ease; }
  .stars { opacity: 0; transition: opacity .8s ease; }
  .night .stars { opacity: 1; }
  .pelican, .bike { cursor: pointer; }
</style>
</head>
<body>
<h1>鹈鹕骑行</h1>

<div class="stage">
<svg id="scene" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="鹈鹕骑自行车的动画场景">
  <defs>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f7"/><stop offset="1" stop-color="#d9f0fb"/>
    </linearGradient>
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b3d"/><stop offset="1" stop-color="#283b6b"/>
    </linearGradient>
  </defs>

  <!-- 天空（上下加长，竖屏放大后也不会露底） -->
  <rect x="0" y="-600" width="900" height="1120" fill="url(#skyDay)"/>
  <g class="night-sky"><rect x="0" y="-600" width="900" height="1120" fill="url(#skyNight)"/></g>
  <circle class="sun" cx="745" cy="95" r="46" fill="#ffd166"/>
  <circle class="night-sun" cx="745" cy="95" r="38" fill="#f4f1de"/>
  <g class="stars" fill="#ffffff">
    <circle cx="80" cy="70" r="2"/><circle cx="180" cy="120" r="1.6"/><circle cx="320" cy="60" r="2"/>
    <circle cx="470" cy="110" r="1.5"/><circle cx="620" cy="55" r="2"/><circle cx="700" cy="150" r="1.6"/>
    <circle cx="140" cy="180" r="1.4"/><circle cx="560" cy="170" r="1.4"/>
    <circle cx="300" cy="-40" r="1.6"/><circle cx="450" cy="-90" r="1.5"/><circle cx="650" cy="-30" r="1.6"/>
  </g>

  <!-- 云 -->
  <g class="clouds" fill="#ffffff" opacity=".85">
    <g transform="translate(0,0)">
      <ellipse cx="150" cy="110" rx="55" ry="22"/><ellipse cx="200" cy="95" rx="40" ry="18"/>
      <ellipse cx="105" cy="100" rx="35" ry="16"/>
      <ellipse cx="540" cy="80" rx="65" ry="24"/><ellipse cx="600" cy="65" rx="45" ry="18"/>
      <ellipse cx="900" cy="130" rx="50" ry="20"/><ellipse cx="950" cy="118" rx="38" ry="16"/>
    </g>
    <g transform="translate(1050,0)">
      <ellipse cx="150" cy="110" rx="55" ry="22"/><ellipse cx="200" cy="95" rx="40" ry="18"/>
      <ellipse cx="105" cy="100" rx="35" ry="16"/>
      <ellipse cx="540" cy="80" rx="65" ry="24"/><ellipse cx="600" cy="65" rx="45" ry="18"/>
      <ellipse cx="900" cy="130" rx="50" ry="20"/><ellipse cx="950" cy="118" rx="38" ry="16"/>
    </g>
  </g>

  <!-- 远山与草地 -->
  <path d="M0 430 L140 330 L300 430 Z" fill="#9ac48a" opacity=".6"/>
  <path d="M220 430 L420 310 L640 430 Z" fill="#7fae72" opacity=".6"/>
  <path d="M560 430 L760 335 L900 430 Z" fill="#9ac48a" opacity=".6"/>
  <rect y="425" width="900" height="600" fill="#5f8f4e"/>

  <!-- 路边点缀：树、灌木、草丛、小花、石子（深色高对比，竖屏也可见） -->
  <g>
    <rect x="200" y="388" width="10" height="42" fill="#7a5230"/>
    <circle cx="205" cy="372" r="26" fill="#3f6b34"/><circle cx="190" cy="384" r="18" fill="#3f6b34"/>
    <ellipse cx="690" cy="438" rx="26" ry="13" fill="#3f6b34"/>
    <ellipse cx="120" cy="440" rx="20" ry="10" fill="#3f6b34"/>
    <path d="M180 522 l8 -20 l8 20 z" fill="#3f6b34"/>
    <path d="M212 530 l9 -22 l9 22 z" fill="#3f6b34"/>
    <path d="M262 524 l7 -18 l7 18 z" fill="#3f6b34"/>
    <path d="M332 536 l8 -20 l8 20 z" fill="#3f6b34"/>
    <path d="M430 526 l7 -18 l7 18 z" fill="#3f6b34"/>
    <path d="M482 540 l9 -22 l9 22 z" fill="#3f6b34"/>
    <path d="M542 528 l8 -20 l8 20 z" fill="#3f6b34"/>
    <path d="M602 544 l9 -22 l9 22 z" fill="#3f6b34"/>
    <path d="M648 530 l7 -18 l7 18 z" fill="#3f6b34"/>
    <path d="M682 548 l8 -20 l8 20 z" fill="#3f6b34"/>
    <path d="M352 448 l6 -14 l6 14 z" fill="#3f6b34"/>
    <path d="M472 452 l6 -14 l6 14 z" fill="#3f6b34"/>
    <path d="M592 450 l6 -14 l6 14 z" fill="#3f6b34"/>
    <circle cx="300" cy="548" r="4" fill="#ffd166"/><circle cx="304" cy="552" r="3" fill="#fff"/>
    <circle cx="520" cy="556" r="4" fill="#ffd166"/><circle cx="524" cy="560" r="3" fill="#fff"/>
    <circle cx="240" cy="564" r="4" fill="#ffd166"/><circle cx="244" cy="568" r="3" fill="#fff"/>
    <circle cx="580" cy="550" r="4" fill="#ffd166"/><circle cx="584" cy="554" r="3" fill="#fff"/>
    <circle cx="340" cy="568" r="7" fill="#8a8f98"/><circle cx="470" cy="560" r="6" fill="#8a8f98"/><circle cx="620" cy="572" r="7" fill="#8a8f98"/>
  </g>

  <!-- 公路 -->
  <rect y="452" width="900" height="48" fill="#3c4048"/>
  <line class="dash" x1="-70" y1="476" x2="970" y2="476" stroke="#f4f1de" stroke-width="4" stroke-dasharray="40 30"/>

  <!-- 自行车 -->
  <g class="bike" stroke-linecap="round">
    <!-- 后轮 -->
    <g>
      <circle cx="250" cy="375" r="56" fill="none" stroke="#26303f" stroke-width="9"/>
      <circle cx="250" cy="375" r="6" fill="#26303f"/>
      <g class="spokes rear" stroke="#5b6b80" stroke-width="3">
        <line x1="250" y1="321" x2="250" y2="429"/>
        <line x1="196" y1="375" x2="304" y2="375"/>
        <line x1="212" y1="337" x2="288" y2="413"/>
        <line x1="288" y1="337" x2="212" y2="413"/>
      </g>
    </g>
    <!-- 前轮 -->
    <g>
      <circle cx="560" cy="375" r="56" fill="none" stroke="#26303f" stroke-width="9"/>
      <circle cx="560" cy="375" r="6" fill="#26303f"/>
      <g class="spokes front" stroke="#5b6b80" stroke-width="3">
        <line x1="560" y1="321" x2="560" y2="429"/>
        <line x1="506" y1="375" x2="614" y2="375"/>
        <line x1="522" y1="337" x2="598" y2="413"/>
        <line x1="598" y1="337" x2="522" y2="413"/>
      </g>
    </g>
    <!-- 车架 -->
    <g stroke="#e2483d" stroke-width="9" fill="none">
      <path d="M250 375 L352 375 L312 268 L250 375"/>
      <path d="M352 375 L528 262 L560 375"/>
      <path d="M312 268 L528 262"/>
      <path d="M528 262 L560 375"/>
    </g>
    <!-- 座管与车把 -->
    <line x1="312" y1="268" x2="300" y2="248" stroke="#26303f" stroke-width="8"/>
    <path d="M528 262 Q 536 238 556 240" fill="none" stroke="#26303f" stroke-width="8"/>
    <ellipse cx="298" cy="246" rx="24" ry="8" fill="#26303f"/>
    <!-- 曲柄与踏板 -->
    <g class="crank">
      <line x1="352" y1="375" x2="384" y2="352" stroke="#26303f" stroke-width="6"/>
      <line x1="352" y1="375" x2="320" y2="398" stroke="#26303f" stroke-width="6"/>
      <rect x="376" y="346" width="18" height="8" rx="3" fill="#111827"/>
      <rect x="306" y="394" width="18" height="8" rx="3" fill="#111827"/>
    </g>
    <circle cx="352" cy="375" r="10" fill="#26303f"/>
    <!-- 链条 -->
    <line x1="352" y1="385" x2="250" y2="375" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 4"/>
  </g>

  <!-- 鹈鹕 -->
  <g class="pelican" id="pelican">
    <!-- 后腿（简化为连到曲柄） -->
    <path d="M310 285 Q 330 330 320 396" fill="none" stroke="#e8892b" stroke-width="7" stroke-linecap="round"/>
    <!-- 尾羽 -->
    <path d="M255 250 L220 262 L252 270 Z" fill="#f4f1de"/>
    <!-- 身体 -->
    <ellipse cx="300" cy="252" rx="52" ry="36" fill="#fdfdf8"/>
    <!-- 脖子与头 -->
    <path d="M330 235 Q 352 205 356 178" fill="none" stroke="#fdfdf8" stroke-width="16" stroke-linecap="round"/>
    <circle cx="358" cy="172" r="15" fill="#fdfdf8"/>
    <!-- 大嘴与喉囊 -->
    <path d="M368 170 L452 186 L368 182 Z" fill="#f5a623"/>
    <path d="M370 182 Q 400 214 452 186 L370 182 Z" fill="#f7b955"/>
    <!-- 眼睛 -->
    <circle cx="356" cy="166" r="3.2" fill="#1f2937"/>
    <circle cx="357" cy="165" r="1" fill="#fff"/>
    <!-- 翅膀 -->
    <ellipse class="wing" cx="288" cy="252" rx="30" ry="18" fill="#e9e4d0" transform="rotate(-18 288 252)"/>
    <!-- 前腿 -->
    <path d="M322 280 Q 350 340 380 354" fill="none" stroke="#f5a623" stroke-width="7" stroke-linecap="round"/>
    <!-- 嘎气泡 -->
    <g class="quack">
      <rect x="410" y="112" width="86" height="44" rx="14" fill="#ffffff" stroke="#e2483d" stroke-width="3"/>
      <path d="M428 152 L420 170 L446 156 Z" fill="#ffffff" stroke="#e2483d" stroke-width="3"/>
      <text x="453" y="141" font-size="24" text-anchor="middle" fill="#e2483d" font-family="system-ui">嘎!</text>
    </g>
  </g>
</svg>
</div>

<div class="controls">
  <label for="speed">速度</label>
  <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1">
  <button id="toggle-night">切换昼夜</button>
  <button id="honk">让鹈鹕叫一声</button>
</div>
<p class="hint">点击鹈鹕也有惊喜 · 拖动滑块调整骑行速度</p>

<script>
  const scene = document.getElementById('scene');
  const pelican = document.getElementById('pelican');
  const speed = document.getElementById('speed');
  const stage = document.querySelector('.stage');
  speed.addEventListener('input', () => {
    scene.style.setProperty('--speed', speed.value || 1);
  });

  function honk() {
    pelican.classList.remove('flapping');
    void pelican.getBoundingClientRect();  // 重置动画
    pelican.classList.add('flapping');
  }
  pelican.addEventListener('click', honk);
  document.getElementById('honk').addEventListener('click', honk);

  document.getElementById('toggle-night').addEventListener('click', () => {
    scene.classList.toggle('night');
  });

  // 视口适配：宽屏用完整 900x520 画面；竖屏收窄视野、放大角色，构图居中
  function fitView() {
    const r = stage.getBoundingClientRect();
    const ar = r.width / Math.max(1, r.height);
    if (ar >= 900 / 520) {
      scene.setAttribute('viewBox', '0 0 900 520');
    } else {
      const w = 520, h = w / ar, x0 = 160, y0 = 280 - h / 2;
      scene.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`);
    }
  }
  window.addEventListener('resize', fitView);
  fitView();
</script>
</body>
</html>
