<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1119">
<title>鹈鹕骑行 · Fo Demo × Muse</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 14px 16px 12px;
    background: radial-gradient(120% 90% at 50% 0%, #1b2436 0%, #0d1119 58%, #090c12 100%);
    color: #e8ecf8;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header { text-align: center; flex-shrink: 0; }
  .kicker { margin: 0 0 2px; font-size: .68rem; letter-spacing: .34em; text-indent: .34em; color: rgba(232,236,248,.48); font-weight: 600; }
  h1 { margin: 0; font-size: clamp(1.05rem, 2.6vh, 1.5rem); font-weight: 700; letter-spacing: .14em; text-indent: .14em; color: #f5d78e; }
  .stage {
    position: relative; flex: 1 1 auto; min-height: 0; width: min(100%, 1100px);
    display: flex; border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.35);
  }
  .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(10,18,32,.28); }
  svg { display: block; width: 100%; height: 100%; background: #8ecfe8; touch-action: manipulation; }
  .controls {
    flex-shrink: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.055); padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(8px); max-width: 100%;
  }
  label { font-size: .92rem; color: rgba(232,236,248,.75); letter-spacing: .08em; }
  #speed-val { font-size: .9rem; color: #f5d78e; font-variant-numeric: tabular-nums; min-width: 2.8em; }
  input[type=range] { width: min(220px, 36vw); height: 34px; accent-color: #f0b429; touch-action: none; cursor: pointer; }
  button {
    font: inherit; font-size: .92rem; padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(245,215,142,.55); background: rgba(245,215,142,.07);
    color: #f5d78e; cursor: pointer; transition: background .2s ease, transform .15s ease;
  }
  button:hover { background: rgba(245,215,142,.18); }
  button:active { transform: scale(.97); }
  button:focus-visible, input:focus-visible { outline: 2px solid #f5d78e; outline-offset: 3px; }
  #sound { padding: 9px 13px; min-width: 44px; }
  .hint { margin: 0; font-size: .84rem; color: rgba(232,236,248,.5); flex-shrink: 0; text-align: center; letter-spacing: .05em; }
  .hint kbd { font: inherit; padding: 0 .35em; border: 1px solid rgba(232,236,248,.25); border-radius: 4px; }
  @media (max-height: 600px) { .hint, .kicker { display: none; } .controls { padding: 6px 14px; } }
  @media (max-width: 560px) { .controls { border-radius: 22px; } .hint .keys { display: none; } }

  /* 只有和"速度"无关的环境动效留给 CSS；骑行相关的一切都由 JS 按同一条"里程"驱动 */
  @keyframes bird-drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(46px,-10px); } }
  .birds { animation: bird-drift 9s ease-in-out infinite; }

  @keyframes flap { 0%,100% { transform: rotate(0deg); } 40% { transform: rotate(-38deg); } }
  .wing { transform-box: fill-box; transform-origin: 15% 20%; }
  .flapping .wing { animation: flap .45s ease-in-out 2; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.15); } 30%,80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.8) translateY(-8px); } }
  .quack { opacity: 0; transform-box: fill-box; transform-origin: 20% 100%; pointer-events: none; }
  .flapping .quack { animation: pop .9s ease-out 1; }

  /* ---------- 昼夜 ---------- */
  .night-sky, .night-sun, .stars, .fireflies, .night-shade, .night-veil, .beam, .lamp-glow, .lh-beam { opacity: 0; transition: opacity .9s ease; }
  .night .night-sky, .night .night-sun, .night .stars, .night .fireflies { opacity: 1; }
  .night .night-shade { opacity: .5; }
  .night .night-veil { opacity: .14; }
  .night .beam { opacity: 1; }
  .night .lamp-glow { opacity: .9; }
  .sun { transition: opacity .9s ease; }
  .night .sun { opacity: 0; }
  .clouds { transition: opacity .9s ease; }
  .night .clouds { opacity: .25; }
  .hill-far, .hill-mid, .sea, .road { transition: fill .9s ease; }
  .night .hill-far { fill: #33506b; }
  .night .hill-mid { fill: #274435; }
  .night .sea { fill: #1d3757; }
  .night .road { fill: #222836; }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .night .stars circle { animation: twinkle 2.6s ease-in-out infinite; }
  .night .stars circle:nth-child(3n) { animation-delay: .7s; }
  .night .stars circle:nth-child(4n) { animation-delay: 1.3s; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .fireflies circle { animation: floaty 3.4s ease-in-out infinite; }
  .fireflies circle:nth-child(2n) { animation-delay: 1.1s; }
  .fireflies circle:nth-child(3n) { animation-delay: 2s; }
  @keyframes lh { 0%,100% { opacity: .15; } 50% { opacity: .85; } }
  .night .lh-beam { animation: lh 2.4s ease-in-out infinite; }
  .pelican, .bike { cursor: pointer; }
</style>
</head>
<body>
<header>
  <p class="kicker">A TINY SEASIDE LOOP</p>
  <h1>鹈鹕骑行</h1>
</header>

<div class="stage">
<svg id="scene" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="一只围着红围巾的鹈鹕骑自行车沿海边公路前进">
  <defs>

      <stop offset="0" stop-color="#5eaed8"/><stop offset=".55" stop-color="#a8d8ec"/><stop offset="1" stop-color="#fdeec9"/>
    </linearGradient>
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">

    </linearGradient>
    <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6da35c"/><stop offset=".25" stop-color="#5a8f4c"/><stop offset="1" stop-color="#3e6a37"/>
    </linearGradient>

      <stop offset="0" stop-color="#f7b733"/><stop offset="1" stop-color="#ee9420"/>
    </linearGradient>
    <radialGradient id="sunHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".5"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".55"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff6c4" stop-opacity="0"/>
    </radialGradient>

    <!-- 以下是会循环滚动的图块，每块宽 900，由 JS 平移 -->
    <g id="tile-clouds-a" fill="#ffffff">

      <ellipse cx="540" cy="70" rx="65" ry="23"/><ellipse cx="600" cy="55" rx="45" ry="17"/>
      <ellipse cx="380" cy="-60" rx="58" ry="20"/><ellipse cx="425" cy="-72" rx="38" ry="15"/>
    </g>
    <g id="tile-clouds-b" fill="#ffffff" opacity=".7">

      <ellipse cx="80" cy="-150" rx="45" ry="14"/><ellipse cx="640" cy="-120" rx="40" ry="12"/>
    </g>
    <g id="tile-sea">
      <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".6">
        <line x1="40" y1="404" x2="62" y2="404"/><line x1="190" y1="414" x2="204" y2="414"/>
        <line x1="330" y1="400" x2="350" y2="400"/><line x1="520" y1="418" x2="536" y2="418"/>
        <line x1="700" y1="406" x2="724" y2="406"/><line x1="820" y1="420" x2="834" y2="420"/>
      </g>
      <!-- 小帆船 -->
      <g transform="translate(610 384)">
        <path d="M0 18 L34 18 L28 25 L6 25 Z" fill="#8a5a2e"/>
        <path d="M17 -6 L17 17 L4 17 Z" fill="#fdfdf8"/><path d="M19 -2 L19 17 L30 17 Z" fill="#d64541"/>
      </g>
    </g>
    <g id="tile-treeline" fill="#3f6b34" opacity=".55">
      <circle cx="90" cy="404" r="17"/><rect x="87" y="404" width="6" height="24" fill="#5d4630"/>
      <circle cx="330" cy="398" r="21"/><rect x="327" y="398" width="6" height="30" fill="#5d4630"/>
      <circle cx="612" cy="406" r="15"/><rect x="609" y="406" width="6" height="22" fill="#5d4630"/>
      <circle cx="828" cy="400" r="19"/><rect x="825" y="400" width="6" height="28" fill="#5d4630"/>
    </g>
    <g id="tile-roadside">
      <rect x="196" y="386" width="11" height="48" fill="#7a5230"/>
      <circle cx="202" cy="368" r="27" fill="#3f6b34"/><circle cx="186" cy="381" r="18" fill="#4a7a3e"/><circle cx="218" cy="380" r="16" fill="#4a7a3e"/>
      <ellipse cx="688" cy="442" rx="27" ry="12" fill="#3f6b34"/>
      <ellipse cx="118" cy="444" rx="21" ry="9" fill="#3f6b34"/>
      <ellipse cx="452" cy="446" rx="17" ry="7" fill="#4a7a3e"/>

        <rect x="-34" y="392" width="70" height="22" rx="4" fill="#f4f1de" stroke="#5d4630" stroke-width="2"/>
        <text x="1" y="408" font-size="12" text-anchor="middle" fill="#1f7a8c" font-family="system-ui, sans-serif" font-weight="700">海边 2km</text>
      </g>
    </g>
    <g id="tile-fg">
      <g stroke="#2e5427" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M60 522 q3 -16 10 -22"/><path d="M74 522 q-2 -13 -8 -19"/>
        <path d="M300 522 q3 -15 9 -21"/><path d="M470 522 q-3 -14 -9 -20"/>
        <path d="M660 522 q3 -16 10 -22"/><path d="M830 522 q-2 -13 -8 -19"/>
        <path d="M150 640 q3 -16 10 -22"/><path d="M560 660 q-3 -14 -9 -20"/><path d="M760 610 q3 -15 9 -21"/>
      </g>
      <circle cx="300" cy="552" r="4" fill="#ffd166"/><circle cx="520" cy="560" r="4" fill="#f9a8c9"/>
      <circle cx="244" cy="572" r="4" fill="#ffffff"/><circle cx="640" cy="566" r="4" fill="#ffd166"/>
      <circle cx="392" cy="580" r="4" fill="#f9a8c9"/><circle cx="96" cy="600" r="4" fill="#ffffff"/>
      <circle cx="720" cy="630" r="4" fill="#f9a8c9"/><circle cx="460" cy="690" r="4" fill="#ffd166"/>
      <circle cx="344" cy="606" r="7" fill="#8a8f98" opacity=".8"/><circle cx="830" cy="580" r="6" fill="#8a8f98" opacity=".8"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect x="-900" y="-900" width="2700" height="1420" fill="url(#skyDay)"/>
  <rect class="night-sky" x="-900" y="-900" width="2700" height="1420" fill="url(#skyNight)"/>

  <!-- 太阳 / 月亮：放在骑手右上方，竖屏也看得到 -->
  <g class="sun">
    <circle cx="598" cy="92" r="78" fill="url(#sunHalo)"/>
    <circle cx="598" cy="92" r="42" fill="#ffd166"/>
  </g>
  <g class="night-sun">
    <circle cx="598" cy="92" r="62" fill="#f6efdb" opacity=".14"/>
    <circle cx="598" cy="92" r="36" fill="#f6efdb"/>
    <circle cx="586" cy="83" r="6" fill="#ddd3b8"/><circle cx="609" cy="101" r="4.5" fill="#ddd3b8"/><circle cx="603" cy="77" r="3" fill="#ddd3b8"/>
  </g>
  <g class="stars" fill="#ffffff">
    <circle cx="80" cy="70" r="2"/><circle cx="180" cy="120" r="1.6"/><circle cx="320" cy="60" r="2"/>
    <circle cx="470" cy="110" r="1.5"/><circle cx="760" cy="55" r="2"/><circle cx="820" cy="150" r="1.6"/>
    <circle cx="140" cy="180" r="1.4"/><circle cx="540" cy="170" r="1.4"/>
    <circle cx="300" cy="-40" r="1.6"/><circle cx="450" cy="-90" r="1.5"/><circle cx="650" cy="-30" r="1.6"/>
    <circle cx="220" cy="-160" r="1.8"/><circle cx="520" cy="-200" r="1.4"/><circle cx="380" cy="-260" r="1.7"/>
  </g>

  <g class="birds" stroke="#33506b" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55">
    <path d="M218 74 q7 -7 14 0 q7 -7 14 0"/><path d="M286 48 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <g class="clouds" opacity=".92">
    <g data-par=".035"><use href="#tile-clouds-b" x="-900"/><use href="#tile-clouds-b"/><use href="#tile-clouds-b" x="900"/><use href="#tile-clouds-b" x="1800"/></g>
    <g data-par=".07"><use href="#tile-clouds-a" x="-900"/><use href="#tile-clouds-a"/><use href="#tile-clouds-a" x="900"/><use href="#tile-clouds-a" x="1800"/></g>
  </g>

  <!-- 远山（对岸）+ 灯塔 -->
  <path class="hill-far" d="M-60 402 L150 318 L330 402 Z" fill="#a8c3a0" opacity=".6"/>
  <path class="hill-far" d="M560 402 L745 326 L960 402 Z" fill="#a8c3a0" opacity=".6"/>
  <g transform="translate(838 0)">
    <path d="M-7 400 L-5 356 L5 356 L7 400 Z" fill="#fdfdf8"/>

    <rect x="-6" y="348" width="12" height="8" rx="1" fill="#33506b"/><path d="M-7 348 L0 340 L7 348 Z" fill="#d64541"/>

  </g>

  <!-- 海 -->

  <rect x="-900" y="396" width="2700" height="2" fill="#ffffff" opacity=".35"/>

  <path class="hill-mid" d="M190 430 L410 318 L640 430 Z" fill="#7aa874" opacity=".85"/>

  <!-- 草地 -->
  <rect x="-900" y="425" width="2700" height="700" fill="url(#meadowGrad)"/>

  <g data-par=".3"><use href="#tile-treeline" x="-900"/><use href="#tile-treeline"/><use href="#tile-treeline" x="900"/><use href="#tile-treeline" x="1800"/></g>
  <g data-par=".9"><use href="#tile-roadside" x="-900"/><use href="#tile-roadside"/><use href="#tile-roadside" x="900"/><use href="#tile-roadside" x="1800"/></g>

  <rect class="night-shade" x="-900" y="425" width="2700" height="700" fill="#16283f"/>

  <!-- 公路 -->
  <rect class="road" x="-900" y="452" width="2700" height="48" fill="#343a44"/>
  <rect x="-900" y="452" width="2700" height="3" fill="#f5d78e" opacity=".35"/>
  <line id="dash" x1="-940" y1="478" x2="1840" y2="478" stroke="#f4f1de" stroke-width="4" stroke-dasharray="40 30" opacity=".9"/>

  <!-- 车灯光束（夜里） -->

  <g data-par="1.3"><use href="#tile-fg" x="-900"/><use href="#tile-fg"/><use href="#tile-fg" x="900"/><use href="#tile-fg" x="1800"/></g>

  <g class="fireflies" fill="#ffe98a">
    <circle cx="180" cy="420" r="3"/><circle cx="330" cy="540" r="2.4"/><circle cx="120" cy="560" r="2.8"/>
    <circle cx="690" cy="540" r="2.4"/><circle cx="770" cy="412" r="3"/><circle cx="560" cy="590" r="2.2"/>
  </g>

  <ellipse cx="405" cy="437" rx="205" ry="9" fill="#1d2b1a" opacity=".22"/>

  <!-- 风线 -->

  </g>

  <!-- 远侧腿 + 远侧曲柄（在车架后面） -->

  <rect id="pedal-far" x="-9" y="-4" width="18" height="8" rx="3" fill="#111827"/>
  <path id="foot-far" d="M-6 -6 L12 -6 L15 -1 L9 -3 L5 0 L1 -3 L-6 -1 Z" fill="#d9822b"/>

  <!-- 自行车 -->

      <circle cx="250" cy="375" r="56" fill="none" stroke="#22303e" stroke-width="9"/>
      <circle cx="250" cy="375" r="49" fill="none" stroke="#e9e2cd" stroke-width="2" opacity=".5"/>

        <line x1="212" y1="337" x2="288" y2="413"/><line x1="288" y1="337" x2="212" y2="413"/>

    <!-- 链条：上下两段，跟着牙盘转 -->

    <path d="M318 272 L522 266" stroke="#9fd4dd" stroke-width="2.5" fill="none" opacity=".8"/>
    <path d="M196 348 A 58 58 0 0 1 250 317" fill="none" stroke="#1f7a8c" stroke-width="6"/>

    <ellipse cx="298" cy="246" rx="24" ry="8" fill="#8a5a2e"/>

    <circle cx="352" cy="375" r="14" fill="none" stroke="#22303e" stroke-width="4"/>
    <!-- 车筐 + 小鱼 -->
    <g id="fish"><path d="M560 274 L546 252 L564 259 L574 248 L576 274 Z" fill="#57a8b5"/></g>

    <path d="M536 283 L582 283 M539 295 L579 295" stroke="#8a5a2e" stroke-width="3"/>
    <path d="M532 272 L586 272" stroke="#8a5a2e" stroke-width="5"/>
    <path d="M534 276 L524 258" stroke="#22303e" stroke-width="4"/>
    <!-- 车灯 -->
    <circle class="lamp-glow" cx="590" cy="289" r="16" fill="url(#glow)"/>
    <circle cx="589" cy="289" r="5" fill="#f4f1de" stroke="#22303e" stroke-width="2.5"/>
  </g>
  <line id="arm-near" x1="352" y1="375" x2="352" y2="375" stroke="#22303e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="352" cy="375" r="7" fill="#22303e"/>
  <rect id="pedal-near" x="-9" y="-4" width="18" height="8" rx="3" fill="#111827"/>

  <!-- 鹈鹕 -->

    <ellipse cx="300" cy="252" rx="52" ry="36" fill="#fdfdf8"/>
    <ellipse cx="302" cy="268" rx="40" ry="17" fill="#eee7d2" opacity=".75"/>
    <path d="M330 235 Q 352 205 356 178" fill="none" stroke="#fdfdf8" stroke-width="16" stroke-linecap="round"/>
    <circle cx="358" cy="172" r="15" fill="#fdfdf8"/>
    <path d="M352 158 Q 350 146 342 142 M358 157 Q 360 146 368 141" stroke="#f1ead6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M368 170 L454 186 L368 182 Z" fill="url(#beakGrad)"/>
    <path d="M370 182 Q 402 216 454 186 L370 182 Z" fill="#f7b955"/>
    <path d="M372 181 L450 186" stroke="#d97f16" stroke-width="1.6" opacity=".6"/>
    <circle cx="356" cy="166" r="3.2" fill="#1f2937"/><circle cx="357" cy="165" r="1" fill="#fff"/>
    <ellipse cx="349" cy="179" rx="5.5" ry="3.4" fill="#f5a3a3" opacity=".55"/>
    <g id="scarf">
      <path d="M336 226 Q 292 202 250 214 Q 262 226 282 228 Q 262 232 252 244 Q 296 246 334 240 Z" fill="#d64541"/>
      <path d="M300 218 Q 282 226 268 224" stroke="#b03030" stroke-width="2.5" fill="none" opacity=".6"/>
    </g>
    <ellipse cx="339" cy="230" rx="13" ry="9" fill="#d64541" transform="rotate(-28 339 230)"/>
    <ellipse cx="335" cy="227" rx="7" ry="4.5" fill="#e2574f" opacity=".55" transform="rotate(-28 335 227)"/>
    <g class="wing">
      <path d="M256 238 Q 300 218 332 242 Q 328 274 290 280 Q 258 272 256 238 Z" fill="#efe8d3"/>
      <path d="M268 250 Q 298 236 322 250 Q 316 268 292 271 Q 272 266 268 250 Z" fill="#e0d4b4"/>
      <path d="M276 244 Q 292 258 292 270 M294 240 Q 308 252 310 264" stroke="#cbbd97" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g class="quack">
      <rect x="410" y="112" width="86" height="44" rx="14" fill="#ffffff" stroke="#d64541" stroke-width="3"/>
      <path d="M428 152 L420 170 L446 156 Z" fill="#ffffff" stroke="#d64541" stroke-width="3"/>
      <text x="453" y="141" font-size="24" text-anchor="middle" fill="#d64541" font-family="system-ui">嘎!</text>
    </g>
  </g>
  <!-- 近侧腿（压在车架和身体前面） -->
  <path id="leg-near" fill="none" stroke="#f5a623" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="foot-near" d="M-6 -6 L12 -6 L15 -1 L9 -3 L5 0 L1 -3 L-6 -1 Z" fill="#f5a623"/>

  <rect class="night-veil" x="-900" y="-900" width="2700" height="2100" fill="#0d1b3d" pointer-events="none"/>
</svg>
</div>

<div class="controls">
  <label for="speed">速度</label>
  <input id="speed" type="range" min="0" max="3" step="0.1" value="1">
  <span id="speed-val" aria-live="polite">×1.0</span>
  <button id="toggle-night" aria-pressed="false">切换到夜晚</button>
  <button id="honk">让鹈鹕叫一声</button>
  <button id="sound" aria-pressed="true" aria-label="声音开关" title="声音开关">🔊</button>
</div>
<p class="hint">点鹈鹕会叫 · 拉过 ×2 起风 · 拉到 0 会慢慢刹停<span class="keys"> · <kbd>←</kbd><kbd>→</kbd> 调速 <kbd>空格</kbd> 叫 <kbd>N</kbd> 昼夜</span></p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const scene = $('scene'), stage = document.querySelector('.stage');
  const pelican = $('pelican'), slider = $('speed'), speedVal = $('speed-val');

  /* ---------- 物理常量 ---------- */
  const GROUND = 190;          // ×1 时地面每秒移动的像素
  const WHEEL_R = 56;          // 轮子半径 → 轮子转角 = 里程 / 半径，绝不打滑
  const GEAR = 1.6;            // 后轮转 1.6 圈，脚踏转 1 圈
  const CRANK = { x: 352, y: 375, r: 34 };
  const HIP_NEAR = { x: 320, y: 282 }, HIP_FAR = { x: 306, y: 284 };
  const THIGH = 66, SHIN = 70;
  const TILE = 900;

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let target = reduce ? 0 : 1;     // 滑块给的目标速度
  let v = 0;                       // 实际速度：带惯性地追向目标（起步加速、松手滑行）
  let dist = 0, flutter = 0, wiggle = 0, last = performance.now();
  if (reduce) { slider.value = 0; }

  const layers = [...scene.querySelectorAll('[data-par]')].map(g => ({ g, f: parseFloat(g.dataset.par) }));
  const el = id => $(id);
  const E = {
    spR: el('spokes-rear'), spF: el('spokes-front'), chain: el('chain'), dash: el('dash'), wind: el('wind'),
    armN: el('arm-near'), armF: el('arm-far'), pedN: el('pedal-near'), pedF: el('pedal-far'),
    legN: el('leg-near'), legF: el('leg-far'), footN: el('foot-near'), footF: el('foot-far'),
    scarf: el('scarf'), fish: el('fish')
  };

  // 两段腿的反向运动学：给定髋和脚踏位置，求膝盖（膝盖朝前弯）
  function leg(hip, foot) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    const max = THIGH + SHIN - .5;
    if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    const a = Math.atan2(dy, dx);
    const b = Math.acos(Math.min(1, Math.max(-1, (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d))));
    const kx = hip.x + THIGH * Math.cos(a - b), ky = hip.y + THIGH * Math.sin(a - b);
    return { d: `M${hip.x} ${hip.y} Q ${(hip.x + kx) / 2 + 3} ${(hip.y + ky) / 2 - 4} ${kx.toFixed(1)} ${ky.toFixed(1)} L ${(hip.x + dx).toFixed(1)} ${(hip.y + dy).toFixed(1)}`,
             fx: hip.x + dx, fy: hip.y + dy };
  }

  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    v += (target - v) * (1 - Math.exp(-dt * (target > v ? 1.6 : 1.1)));
    if (Math.abs(v - target) < .002) v = target;
    dist += v * GROUND * dt;

    // 视差：每一层按自己的系数滚动，同一条里程
    for (const { g, f } of layers) g.setAttribute('transform', `translate(${(-(dist * f) % TILE).toFixed(2)} 0)`);
    E.dash.setAttribute('stroke-dashoffset', (dist % 70).toFixed(2));

    const wheel = dist / WHEEL_R;                // 弧度
    const wdeg = wheel * 180 / Math.PI;
    E.spR.setAttribute('transform', `rotate(${wdeg.toFixed(2)} 250 375)`);
    E.spF.setAttribute('transform', `rotate(${wdeg.toFixed(2)} 560 375)`);
    const crank = wheel / GEAR;
    E.chain.setAttribute('stroke-dashoffset', (-crank * 14).toFixed(2));

    // 踩踏起伏：每半圈上下一次，速度越低越平稳
    const bob = -2.6 * Math.pow(Math.sin(crank), 2) * Math.min(1, v);
    pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    const pN = { x: CRANK.x + CRANK.r * Math.cos(crank), y: CRANK.y + CRANK.r * Math.sin(crank) };
    const pF = { x: CRANK.x - CRANK.r * Math.cos(crank), y: CRANK.y - CRANK.r * Math.sin(crank) };
    E.armN.setAttribute('x2', pN.x.toFixed(1)); E.armN.setAttribute('y2', pN.y.toFixed(1));
    E.armF.setAttribute('x2', pF.x.toFixed(1)); E.armF.setAttribute('y2', pF.y.toFixed(1));
    E.pedN.setAttribute('transform', `translate(${pN.x.toFixed(1)} ${pN.y.toFixed(1)})`);
    E.pedF.setAttribute('transform', `translate(${pF.x.toFixed(1)} ${pF.y.toFixed(1)})`);
    const lN = leg({ x: HIP_NEAR.x, y: HIP_NEAR.y + bob }, { x: pN.x, y: pN.y - 4 });
    const lF = leg({ x: HIP_FAR.x, y: HIP_FAR.y + bob }, { x: pF.x, y: pF.y - 4 });
    E.legN.setAttribute('d', lN.d); E.legF.setAttribute('d', lF.d);
    E.footN.setAttribute('transform', `translate(${lN.fx.toFixed(1)} ${(lN.fy + 1).toFixed(1)})`);
    E.footF.setAttribute('transform', `translate(${lF.fx.toFixed(1)} ${(lF.fy + 1).toFixed(1)})`);

    // 围巾和鱼尾：频率、幅度都随速度变化（用相位累加，变速不跳帧）
    flutter += dt * Math.PI * 2 * (.5 + 1.1 * v);
    wiggle  += dt * Math.PI * 2 * (.6 + .8 * v);
    const amp = 2 + 6 * Math.min(1, v / 2);
    const lift = -4 * Math.min(1, v / 2.5);      // 越快围巾越往上扬
    E.scarf.setAttribute('transform', `rotate(${(lift + amp * Math.sin(flutter)).toFixed(2)} 336 232)`);
    E.fish.setAttribute('transform', `rotate(${(8 * Math.sin(wiggle)).toFixed(2)} 562 274)`);

    // 风：×1.6 起渐显，不是开关
    E.wind.setAttribute('opacity', Math.max(0, Math.min(.6, (v - 1.6) / 1.2)).toFixed(3));
    E.wind.setAttribute('stroke-dashoffset', (dist * .6 % 56).toFixed(2));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 控件 ---------- */
  function setSpeed(x) {
    target = Math.max(0, Math.min(3, Math.round(x * 10) / 10));
    slider.value = target;
    speedVal.textContent = target === 0 ? '刹停' : '×' + target.toFixed(1);
  }
  slider.addEventListener('input', () => setSpeed(parseFloat(slider.value) || 0));
  setSpeed(target);

  let audio = null, soundOn = true;
  function quackSound() {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const t0 = audio.currentTime;
      [0, .17].forEach((off, i) => {
        const t = t0 + off;
        const o = audio.createOscillator(), f = audio.createBiquadFilter(), g = audio.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(i ? 560 : 620, t);
        o.frequency.exponentialRampToValueAtTime(i ? 300 : 340, t + .14);
        f.type = 'bandpass'; f.frequency.value = 1300; f.Q.value = 4;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.22, t + .015);
        g.gain.exponentialRampToValueAtTime(.001, t + .16);
        o.connect(f).connect(g).connect(audio.destination);
        o.start(t); o.stop(t + .18);
      });
    } catch (e) { /* 没有音频也不影响动画 */ }
  }
  function honk() {
    pelican.classList.remove('flapping');
    void pelican.getBoundingClientRect();
    pelican.classList.add('flapping');
    quackSound();
  }
  pelican.addEventListener('click', honk);
  $('honk').addEventListener('click', honk);

  const soundBtn = $('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  });

  const nightBtn = $('toggle-night');
  function toggleNight() {
    const night = scene.classList.toggle('night');
    nightBtn.textContent = night ? '切换到白天' : '切换到夜晚';
    nightBtn.setAttribute('aria-pressed', String(night));
  }
  nightBtn.addEventListener('click', toggleNight);

  addEventListener('keydown', e => {
    if (e.target === slider && e.key.startsWith('Arrow')) return;   // 滑块自己处理方向键
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { setSpeed(target + .2); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { setSpeed(target - .2); e.preventDefault(); }
    else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { honk(); e.preventDefault(); }
    else if (e.key === 'n' || e.key === 'N') toggleNight();
  });

  /* ---------- 镜头：连续缩放，任何比例都完整框住鹈鹕和公路 ---------- */
  function fitView() {
    const r = stage.getBoundingClientRect();
    const ar = r.width / Math.max(1, r.height);
    let h = 520, w = h * ar;
    if (w > 900) { h = Math.max(400, 900 / ar); w = h * ar; }   // 超宽屏：略收高度，两侧世界本就画宽了
    if (w < 500) { w = 500; h = w / ar; }                       // 竖屏：保底宽度装下整辆车，向上多给天空
    let x0 = w <= 900 ? Math.min(900 - w, Math.max(0, 405 - w / 2)) : 450 - w / 2;
    const y0 = h >= 520 ? 520 + (h - 520) * .22 - h : 512 - h;
    scene.setAttribute('viewBox', `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  new ResizeObserver(fitView).observe(stage);
  fitView();
})();
</script>
</body>
</html>
